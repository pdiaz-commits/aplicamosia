# /etc/nginx/sites-available/aplicamosia.es
# Django Gunicorn en 127.0.0.1:8047 — no tocar oca-i.net
# SSL: Let's Encrypt /etc/letsencrypt/live/aplicamosia.es/ (certbot --nginx)

upstream aplicamosia_django {
    server 127.0.0.1:8047;
    keepalive 8;
}

server {
    listen 80;
    server_name aplicamosia.es www.aplicamosia.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl; # managed by Certbot
    server_name aplicamosia.es www.aplicamosia.es;

    ssl_certificate /etc/letsencrypt/live/aplicamosia.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aplicamosia.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 8M;

    location /static/ {
        alias /var/www/aplicamosia.es/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://aplicamosia_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
